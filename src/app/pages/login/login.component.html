<div class="login-container animate-fade-in">
  <div class="login-panel glass-panel">
    <div class="logo-area">
      <img src="logo-orion.png" alt="Logo Club Orión" class="logo-icon">
      <h2>Club Orión</h2>
      <p class="subtitle">Portal de gestión del Club de Conquistadores Orión</p>
    </div>

    <form (ngSubmit)="ingresar()">
      <div class="form-group">
        <label>Correo</label>
        <input type="email" [(ngModel)]="email" name="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" required autocomplete="current-password">
      </div>

      @if (error()) {
        <p class="error-text">{{ error() }}</p>
      }

      <button type="submit" class="btn btn-primary btn-full" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
